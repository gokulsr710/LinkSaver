name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APKs
        run: gradle assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: LinkSaver-apk
          path: app/build/outputs/apk/release/*.apk

      # Publishes the APKs as a GitHub Release so they can be downloaded straight on a phone
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: LinkSaver build ${{ github.run_number }}
          body: Install app-arm64-v8a-release.apk on most phones.
          files: app/build/outputs/apk/release/*.apk
